<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>密碼已重設</title>
    <style>
        * { box-sizing: border-box; }
        body {
            display: grid; min-height: 100vh; margin: 0;
            place-items: center; font-family: Arial, "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, rgba(16,37,54,0.94), rgba(7,18,30,0.9)), #13586b;
        }
        .card {
            width: min(420px, calc(100vw - 36px)); padding: 28px;
            border: 5px solid #0b1220; border-radius: 8px;
            background: #f8fafc; color: #111827;
            box-shadow: 0 18px 0 rgba(0,0,0,0.24);
        }
        h1 { margin: 0 0 12px; font-size: 28px; }
        p { color: #374151; }
        a {
            display: inline-block; margin-top: 16px;
            padding: 12px 20px; border-radius: 8px;
            color: #102018; background: #34d399;
            box-shadow: 0 8px 0 #167853;
            font-weight: 800; text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>密碼已重設</h1>
        <p>你的密碼已成功變更，請用新密碼登入。</p>
        <a href="{% url 'login' %}">前往登入</a>
    </main>
</body>
</html>
