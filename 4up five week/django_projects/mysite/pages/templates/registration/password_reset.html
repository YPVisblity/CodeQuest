<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>忘記密碼</title>
    <style>
        * { box-sizing: border-box; }
        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background:
                linear-gradient(135deg, rgba(16, 37, 54, 0.94), rgba(7, 18, 30, 0.9)),
                #13586b;
        }
        .card {
            width: min(420px, calc(100vw - 36px));
            padding: 28px;
            border: 5px solid #0b1220;
            border-radius: 8px;
            background: #f8fafc;
            color: #111827;
            box-shadow: 0 18px 0 rgba(0,0,0,0.24);
        }
        h1 { margin: 0 0 8px; font-size: 28px; }
        p { margin: 0 0 20px; color: #374151; font-size: 14px; }
        label { display: block; margin-bottom: 6px; font-weight: 800; }
        input {
            width: 100%;
            margin-bottom: 16px;
            padding: 12px;
            border: 3px solid #111827;
            border-radius: 8px;
            font: inherit;
        }
        .actions { display: flex; align-items: center; justify-content: space-between; }
        button {
            border: 0; border-radius: 8px;
            padding: 13px 20px;
            color: #102018; background: #34d399;
            box-shadow: 0 8px 0 #167853;
            font-weight: 800; cursor: pointer;
        }
        a { color: #1f2937; font-weight: 800; text-decoration: none; }
    </style>
</head>
<body>
    <main class="card">
        <h1>忘記密碼</h1>
        <p>輸入你的帳號，系統會顯示該帳號的密碼。</p>
        <form method="post">
            {% csrf_token %}
            <label>帳號</label>
            {{ form.username }}
            {% comment %} 原先的程式碼是使用 email 來重設密碼，但現在改成使用 username 來重設密碼，所以這裡的表單欄位也改成 username。
            <p>輸入你的 Email，我們會寄送重設密碼的連結。</p>
            <label>Email</label>
            {{ form.email }}
            到這裡 {% endcomment %} 
            <div class="actions">
                <a href="{% url 'login' %}">返回登入</a>
                <button type="submit">送出</button>
            </div>
        </form>
    </main>
    {% if messages %}
        <script>
            {% for message in messages %}
                alert("{{ message|escapejs }}");
            {% endfor %}
        </script>
    {% endif %}
</body>
</html>
