<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>找不到 Email</title>
    <style>
        * { box-sizing: border-box; }
        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, rgba(16,37,54,0.94), rgba(7,18,30,0.9)), #13586b;
        }
        .card {
            width: min(420px, calc(100vw - 36px));
            padding: 28px;
            border: 5px solid #0b1220;
            border-radius: 8px;
            background: #f8fafc;
            color: #111827;
            box-shadow: 0 18px 0 rgba(0,0,0,0.24);
        }
        h1 { margin: 0 0 12px; font-size: 28px; }
        p { color: #374151; line-height: 1.7; }
        a {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 20px;
            border-radius: 8px;
            color: #102018;
            background: #34d399;
            box-shadow: 0 8px 0 #167853;
            font-weight: 800;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>找不到這個 Email</h1>
        <p>請確認 Email 是否輸入正確，或先註冊帳號。</p>
        <a href="{% url 'password_reset' %}">重新輸入</a>
    </main>
</body>
</html>
