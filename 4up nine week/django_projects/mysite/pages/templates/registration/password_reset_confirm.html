<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>設定新密碼</title>
    <style>
        * { box-sizing: border-box; }
        body {
            display: grid; min-height: 100vh; margin: 0;
            place-items: center; font-family: Arial, "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, rgba(16,37,54,0.94), rgba(7,18,30,0.9)), #13586b;
        }
        .card {
            width: min(420px, calc(100vw - 36px)); padding: 28px;
            border: 5px solid #0b1220; border-radius: 8px;
            background: #f8fafc; color: #111827;
            box-shadow: 0 18px 0 rgba(0,0,0,0.24);
        }
        h1 { margin: 0 0 20px; font-size: 28px; }
        label { display: block; margin-bottom: 6px; font-weight: 800; }
        input {
            width: 100%; margin-bottom: 16px; padding: 12px;
            border: 3px solid #111827; border-radius: 8px; font: inherit;
        }
        .error { margin-bottom: 12px; padding: 10px; border-radius: 8px; color: #7f1d1d; background: #fee2e2; font-weight: 800; font-size: 14px; }
        .actions { display: flex; align-items: center; justify-content: space-between; }
        button {
            border: 0; border-radius: 8px; padding: 13px 20px;
            color: #102018; background: #34d399;
            box-shadow: 0 8px 0 #167853;
            font-weight: 800; cursor: pointer;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>設定新密碼</h1>
        {% if form.errors %}
            <div class="error">
                {% for field in form %}{% for error in field.errors %}{{ error }}<br>{% endfor %}{% endfor %}
            </div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label>新密碼</label>
            {{ form.new_password1 }}
            <label>確認新密碼</label>
            {{ form.new_password2 }}
            <div class="actions">
                <span></span>
                <button type="submit">確認變更</button>
            </div>
        </form>
    </main>
</body>
</html>
