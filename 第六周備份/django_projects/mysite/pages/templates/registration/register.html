<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>註冊 Code Quest</title>
    <style>
        * { box-sizing: border-box; }
        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            color: #f8fafc;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background:
                linear-gradient(135deg, rgba(16, 37, 54, 0.94), rgba(7, 18, 30, 0.9)),
                repeating-linear-gradient(45deg, transparent 0 96px, rgba(255, 255, 255, 0.045) 96px 99px, transparent 99px 192px),
                #13586b;
        }
        .card {
            width: min(420px, calc(100vw - 36px));
            padding: 28px;
            border: 5px solid #0b1220;
            border-radius: 8px;
            background: #f8fafc;
            color: #111827;
            box-shadow: 0 18px 0 rgba(0, 0, 0, 0.24);
        }
        h1 { margin: 0 0 20px; font-size: 34px; }
        label { display: block; margin-bottom: 6px; font-weight: 800; }
        input {
            width: 100%;
            margin-bottom: 14px;
            padding: 12px;
            border: 3px solid #111827;
            border-radius: 8px;
            font: inherit;
        }
        .error {
            margin-bottom: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            color: #7f1d1d;
            background: #fee2e2;
            font-weight: 800;
            font-size: 14px;
        }
        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 8px;
        }
        button {
            border: 0;
            border-radius: 8px;
            padding: 13px 20px;
            color: #fff;
            background: #3b82f6;
            box-shadow: 0 8px 0 #1d4ed8;
            font-weight: 800;
            cursor: pointer;
        }
        a { color: #1f2937; font-weight: 800; text-decoration: none; border-radius: 8px; }
    </style>
</head>
<body>
    <main class="card">
        <h1>帳號註冊</h1>
        {% if form.errors %}
            <div class="error">
                {% for field in form %}
                    {% for error in field.errors %}
                        {{ error }}<br>
                    {% endfor %}
                {% endfor %}
            </div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label>電子郵件</label>
            {{form.email}}
            <label>帳號</label>
            {{ form.username }}
            <label>密碼</label>
            {{ form.password1 }}
            <label>確認密碼</label>
            {{ form.password2 }}
            <div class="actions">
                <a href="{% url 'login' %}">返回登入</a>
                <button type="submit">註冊</button>
            </div>
        </form>
    </main>
</body>
</html>
